name: Validación

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Construir imagen de producción
        run: docker build -t talent-on:ci .

      - name: Comprobar servidor y healthcheck
        shell: bash
        run: |
          docker run --detach --name talent-on-ci --publish 3000:3000 --env PORT=3000 talent-on:ci
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs talent-on-ci
          exit 1

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Validar Worker
        run: npm run check
