<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="128x128" href="/talent-on-favicon.png?v=20261023" />
    <title>TalentCC - Gestión de Talento Contact Center</title>
    <meta name="description" content="Plataforma SaaS integral de selección, capacitación, OJT y gestión de talento para contact centers con flujo unificado de candidatos." />
    <meta property="og:title" content="TalentCC - Gestión de Talento Contact Center" />
    <meta property="og:description" content="Plataforma SaaS integral de selección, capacitación, OJT y gestión de talento para contact centers con flujo unificado de candidatos." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-teal-500 selection:text-white">
    <div id="root"></div>
    <script>
      (() => {
        const root = document.getElementById('root');
        const showStartupError = () => {
          if (!root || root.childElementCount) return;
          const panel = document.createElement('main');
          panel.style.cssText = 'min-height:100vh;display:grid;place-items:center;background:#f8fafc;color:#143a56;font:16px system-ui,sans-serif;padding:24px;box-sizing:border-box';
          const card = document.createElement('div');
          card.style.cssText = 'max-width:420px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:24px;box-shadow:0 8px 24px #0f172a12';
          const title = document.createElement('h1');
          title.textContent = 'No pudimos iniciar Talent-On';
          title.style.cssText = 'font-size:22px;margin:0 0 10px';
          const detail = document.createElement('p');
          detail.textContent = 'Comprueba tu conexión e intenta cargar de nuevo. Tus datos guardados no se han modificado.';
          detail.style.cssText = 'color:#475569;line-height:1.5;margin:0 0 18px';
          const retry = document.createElement('button');
          retry.type = 'button';
          retry.textContent = 'Actualizar página';
          retry.style.cssText = 'background:#143a56;color:white;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;font:inherit';
          retry.addEventListener('click', () => window.location.reload());
          card.append(title, detail, retry);
          panel.append(card);
          root.replaceChildren(panel);
        };
        window.addEventListener('error', event => {
          if (event.target instanceof HTMLScriptElement && event.target.type === 'module') showStartupError();
        }, true);
        window.setTimeout(showStartupError, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
